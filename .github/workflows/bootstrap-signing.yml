name: Initialize release signing

on:
  workflow_dispatch:
    inputs:
      reply_public_key:
        description: Base64 public encryption key for the device challenge
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: initialize-release-signing
  cancel-in-progress: false

jobs:
  initialize:
    if: github.repository == 'petto10/stealth-link' && github.actor == 'petto10' && github.triggering_actor == 'petto10' && github.run_attempt == 1 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Prepare encrypted device challenge
        env:
          REPLY_PUBLIC_KEY: ${{ inputs.reply_public_key }}
        run: python3 scripts/bootstrap-signing.py prepare

      - name: Share encrypted device challenge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-device-challenge
          path: ${{ runner.temp }}/stealth-link-device-public/challenge.b64
          if-no-files-found: error
          retention-days: 1

      - name: Provision signing after owner approval
        run: python3 scripts/bootstrap-signing.py provision
